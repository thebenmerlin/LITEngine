name: Deploy LITEngine Backend to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'lit-backend/**'
      - '.github/workflows/deploy-hf-space.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_USER: ${{ vars.HF_USER }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push backend subtree to Space
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HF_USER" || -z "$HF_TOKEN" ]]; then
            echo 'Set the HF_USER repository variable and HF_TOKEN repository secret.' >&2
            exit 1
          fi
          if [[ ! "$HF_USER" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo 'HF_USER contains unexpected characters.' >&2
            exit 1
          fi

          split_sha="$(git subtree split --prefix=lit-backend HEAD)"
          askpass="$RUNNER_TEMP/hf-git-askpass.sh"
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' __token__ ;;
            *Password*) printf '%s\n' "$HF_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0

          remote="https://huggingface.co/spaces/$HF_USER/litengine-backend"
          # A non-fast-forward error protects changes made directly in the
          # Space repo. Seed the dedicated Space once using the documented
          # manual command, then let this workflow make fast-forward pushes.
          git push "$remote" "$split_sha:refs/heads/main"
